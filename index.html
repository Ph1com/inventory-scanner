<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbyAK1aoIrb-VR-h0JL25FgE2dWCtt4kEUxPvg4z8e0p7006PXaGA9iep4s7w0cBiRvn/exec";

function onScanSuccess(decodedText) {
  document.getElementById("result").innerHTML = "Scanned: " + decodedText;

  fetch(apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ barcode: decodedText })
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById("result").innerHTML =
      "Saved ✔ (" + decodedText + ")";
  })
  .catch(err => {
    document.getElementById("result").innerHTML =
      "Error sending to server";
  });
}

Html5Qrcode.getCameras().then(cameras => {
  if (cameras && cameras.length) {
    const cameraId = cameras[0].id; // default
    const cameraSelect = document.createElement("select");

    cameras.forEach(cam => {
      const opt = document.createElement("option");
      opt.value = cam.id;
      opt.textContent = cam.label || "Camera";
      cameraSelect.appendChild(opt);
    });

    document.body.insertBefore(cameraSelect, document.getElementById("reader"));

    cameraSelect.addEventListener("change", () => {
      scanner.stop().then(() => {
        scanner.start(cameraSelect.value, { fps: 10, qrbox: 250 }, onScanSuccess);
      });
    });

    const scanner = new Html5Qrcode("reader");
    scanner.start(cameraId, { fps: 10, qrbox: 250 }, onScanSuccess);
  }
});
</script>
