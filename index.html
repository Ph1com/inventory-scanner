<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbyAK1aoIrb-VR-h0JL25FgE2dWCtt4kEUxPvg4z8e0p7006PXaGA9iep4s7w0cBiRvn/exec";

function onScanSuccess(decodedText) {
  document.getElementById("result").innerHTML = "Scanned: " + decodedText;

  fetch(apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ barcode: decodedText })
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById("result").innerHTML =
      "Saved ✔ (" + decodedText + ")";
  })
  .catch(err => {
    document.getElementById("result").innerHTML =
      "Error sending to server";
  });
}

let scanner;

Html5Qrcode.getCameras().then(cameras => {
  const select = document.getElementById("cameraSelect");

  cameras.forEach(cam => {
    const opt = document.createElement("option");
    opt.value = cam.id;
    opt.textContent = cam.label || "Camera";
    select.appendChild(opt);
  });

  scanner = new Html5Qrcode("reader");

  // ⭐ Always start with camera0 (only one that never blanks)
  const safeStartCam = cameras[0].id;
  select.value = safeStartCam;

  scanner.start(
    safeStartCam,
    { fps: 10, qrbox: 250 },
    onScanSuccess
  ).then(() => {

    // ⭐ Delay the switch so the scanner fully initialises first
    setTimeout(() => {
      if (cameras[2]) {
        select.value = cameras[2].id;
        scanner.stop().then(() => {
          scanner.start(
            cameras[2].id,
            { fps: 10, qrbox: 250 },
            onScanSuccess
          );
        });
      }
    }, 500); // ⭐ 500ms delay prevents blank page

  });

  select.addEventListener("change", () => {
    scanner.stop().then(() => {
      scanner.start(
        select.value,
        { fps: 10, qrbox: 250 },
        onScanSuccess
      );
    });
  });
});
</script>
