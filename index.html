<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #reader { width: 300px; margin-top: 20px; }
    #result { margin-top: 20px; font-size: 20px; }
    #cameraSelect { margin-top: 10px; padding: 8px; font-size: 16px; }
  </style>
</head>

<body>

<h2>Inventory Scanner</h2>

<select id="cameraSelect"></select>
<div id="reader"></div>
<div id="result"></div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbyAK1aoIrb-VR-h0JL25FgE2dWCtt4kEUxPvg4z8e0p7006PXaGA9iep4s7w0cBiRvn/exec";

function onScanSuccess(decodedText) {
  document.getElementById("result").innerHTML = "Scanned: " + decodedText;

  fetch(apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ barcode: decodedText })
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById("result").innerHTML =
      "Saved ✔ (" + decodedText + ")";
  })
  .catch(err => {
    document.getElementById("result").innerHTML =
      "Error sending to server";
  });
}

let scanner;

Html5Qrcode.getCameras().then(cameras => {
  const select = document.getElementById("cameraSelect");

  cameras.forEach(cam => {
    const opt = document.createElement("option");
    opt.value = cam.id;
    opt.textContent = cam.label || "Camera";
    select.appendChild(opt);
  });

  scanner = new Html5Qrcode("reader");

  // Start with the FIRST camera (usually rear)
  scanner.start(
    cameras[0].id,
    { fps: 10, qrbox: 250 },
    onScanSuccess
  );

  select.addEventListener("change", () => {
    scanner.stop().then(() => {
      scanner.start(
        select.value,
        { fps: 10, qrbox: 250 },
        onScanSuccess
      );
    });
  });
});
</script>

</body>
</html>
